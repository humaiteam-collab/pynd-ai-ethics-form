<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">เครื่องมือตรวจสอบและรับรองจริยธรรมการใช้ปัญญาประดิษฐ์ในงานวิจัย</title>
<link rel="stylesheet" href="fonts/sarabun.css">
<style>
  :root{
    --navy:#1c3644; --navy-light:#2b4d61; --navy-pale:#e7edf0;
    --gold:#b3822f; --gold-pale:#f3e7d0;
    --paper:#f6f4ee; --card:#ffffff; --border:#dcd6c8;
    --text:#232a2e; --text-soft:#5c6670;
    --green:#2f7a53; --green-bg:#e5f3ea;
    --amber:#a9741e; --amber-bg:#faf0da;
    --red:#b3403a; --red-bg:#fbe8e6;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:'Sarabun',sans-serif; font-size:16px; line-height:1.65;
    padding-bottom:80px;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 20px;}
  header.top{background:var(--navy); color:#fff; padding:38px 0 30px;}
  header.top h1{
    font-family:'Taviraj',serif; font-weight:600; font-size:1.75rem;
    margin:0 0 6px; line-height:1.35;
  }
  header.top .sub{font-size:1.0rem; opacity:.85; margin:0 0 4px;}
  header.top .ver{
    display:inline-block; margin-top:10px; font-size:.85rem;
    background:rgba(255,255,255,.12); padding:4px 12px; border-radius:999px;
  }
  .toolbar{
    position:sticky; top:0; z-index:50; background:#fff;
    border-bottom:1px solid var(--border); box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  .toolbar .wrap{display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:10px 20px;}
  .btn{
    font-family:'Sarabun',sans-serif; font-size:.92rem; font-weight:600;
    border:1px solid var(--navy); background:#fff; color:var(--navy);
    padding:8px 16px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:var(--navy-pale);}
  .btn.primary{background:var(--navy); color:#fff;}
  .btn.primary:hover{background:var(--navy-light);}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn.gold:hover{opacity:.9;}
  .btn.small{padding:5px 11px; font-size:.82rem;}
  .btn.danger-outline{border-color:var(--red); color:var(--red);}
  .btn.danger-outline:hover{background:var(--red-bg);}
  input[type=file]{display:none;}

  .lang-switch{
    margin-left:auto; display:flex; border:1px solid var(--navy); border-radius:999px; overflow:hidden;
  }
  .lang-switch button{
    font-family:'Sarabun',sans-serif; font-weight:700; font-size:.85rem; padding:7px 16px;
    border:none; background:#fff; color:var(--navy); cursor:pointer;
  }
  .lang-switch button.active{background:var(--navy); color:#fff;}

  section.block{margin:34px 0;}
  .section-head{
    display:flex; align-items:baseline; gap:12px; margin-bottom:14px;
    border-bottom:2px solid var(--navy); padding-bottom:8px;
  }
  .section-head .num{
    font-family:'Taviraj',serif; font-weight:600; font-size:1.5rem; color:var(--gold);
  }
  .section-head h2{font-size:1.2rem; margin:0; color:var(--navy);}
  .hint{color:var(--text-soft); font-size:.88rem; font-style:italic; margin:0 0 14px;}
  .note-box{
    background:var(--gold-pale); border:1px solid #e2cd9c; border-radius:var(--radius);
    padding:14px 18px; font-size:.92rem; margin:14px 0;
  }
  .instructions{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 22px; font-size:.95rem; color:var(--text-soft);
  }

  table.overview{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:10px;}
  table.overview th, table.overview td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
  table.overview th{background:var(--navy-pale); color:var(--navy);}

  details.ref{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 20px; margin-top:16px;
  }
  details.ref summary{cursor:pointer; font-weight:600; color:var(--navy);}
  table.master{width:100%; border-collapse:collapse; font-size:.85rem; margin-top:12px;}
  table.master th, table.master td{border:1px solid var(--border); padding:6px 9px; text-align:left;}
  table.master th{background:var(--navy-pale); color:var(--navy);}
  .tag-scored{background:var(--green-bg);}
  .tag-flag{background:var(--red-bg);}
  .tag-none{background:#f1f0eb;}
  .legend-line{font-size:.82rem; margin-top:8px; color:var(--text-soft);}
  .swatch{display:inline-block; padding:1px 8px; border-radius:4px; font-weight:600;}

  .field-grid{display:flex; flex-wrap:wrap; gap:14px 20px;}
  .field-grid > div{flex:1 1 260px;}
  .field-grid .full{flex:1 1 100%;}
  label.field-label{display:block; font-weight:600; font-size:.9rem; margin-bottom:4px; color:var(--navy);}
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; font-family:'Sarabun',sans-serif; font-size:.95rem;
    padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);
  }
  textarea{resize:vertical; min-height:56px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .radio-row{display:flex; gap:22px; flex-wrap:wrap; padding:6px 0;}
  .radio-row label{font-size:.95rem; display:flex; align-items:center; gap:6px; cursor:pointer;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  .entry-card{border-left:5px solid var(--gold);}
  .entry-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .entry-head .title{font-weight:700; color:var(--navy); font-size:1.05rem;}
  .q-label{font-weight:600; font-size:.95rem; margin:16px 0 6px; color:var(--navy);}
  .q-hint{font-weight:400; font-style:italic; color:var(--text-soft); font-size:.82rem;}
  .opt{display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:.92rem;}
  .opt input{margin-top:4px; flex-shrink:0;}
  .opt .code{font-weight:700; color:var(--navy); margin-right:2px;}
  .opt .note{color:var(--text-soft); font-size:.85rem;}
  .score-chip{
    display:inline-block; background:var(--green-bg); color:var(--green); font-weight:700;
    font-size:.78rem; padding:1px 7px; border-radius:999px; margin-left:6px;
  }
  .empty-state{
    text-align:center; padding:30px 10px; color:var(--text-soft); font-size:.92rem;
    border:1.5px dashed var(--border); border-radius:var(--radius);
  }

  .summary-grid{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:18px;}
  .stat{flex:1 1 180px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center;}
  .stat .val{font-family:'Taviraj',serif; font-size:1.7rem; font-weight:600; color:var(--navy);}
  .stat .lbl{font-size:.78rem; color:var(--text-soft); margin-top:2px;}
  .formula-box{
    background:var(--navy-pale); border-radius:var(--radius); padding:16px 20px; font-size:.92rem; margin:14px 0;
  }
  .formula-box code{font-size:.96rem;}
  .gauge-wrap{margin:20px 0;}
  .gauge-track{
    position:relative; height:26px; background:#eae7dd; border-radius:999px; overflow:hidden; border:1px solid var(--border);
  }
  .gauge-fill{height:100%; width:0%; background:var(--text-soft); transition:width .35s ease, background .35s ease;}
  .gauge-threshold{
    position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--navy); left:40%;
  }
  .gauge-threshold::after{
    content:attr(data-label); position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    font-size:.72rem; color:var(--navy); white-space:nowrap;
  }
  .result-badge{
    display:inline-block; margin-top:14px; padding:8px 16px; border-radius:8px; font-weight:700; font-size:.95rem;
  }
  .result-badge.ok{background:var(--green-bg); color:var(--green);}
  .result-badge.warn{background:var(--amber-bg); color:var(--amber);}
  .result-badge.danger{background:var(--red-bg); color:var(--red);}
  .result-badge.neutral{background:#eee; color:var(--text-soft);}
  .threshold-row{display:flex; align-items:center; gap:10px; margin:10px 0; font-size:.92rem; flex-wrap:wrap;}
  .threshold-row input{width:80px;}

  .cert-item{display:flex; gap:9px; padding:7px 0; font-size:.92rem; align-items:flex-start; border-bottom:1px dashed var(--border);}
  .cert-item:last-child{border-bottom:none;}
  .cert-item input{margin-top:3px; flex-shrink:0;}

  .sig-row{display:flex; gap:14px; margin-bottom:16px; align-items:end; flex-wrap:wrap;}
  .sig-row > div:first-child{flex:2 1 260px;}
  .sig-row > div:last-child{flex:1 1 140px;}

  footer{text-align:center; color:var(--text-soft); font-size:.82rem; padding:30px 0;}

  @media (max-width:640px){
    .field-grid > div{flex:1 1 100%;}
    .stat{flex:1 1 45%;}
  }

  @media print{
    .toolbar, .btn, #addEntryBtn, .no-print{display:none !important;}
    header.top{background:#fff !important; color:#000 !important; padding:10px 0;}
    header.top .ver{background:none; border:1px solid #000; color:#000;}
    body{background:#fff;}
    .card{box-shadow:none; border:1px solid #999;}
  }
</style>
</head>

<style>
  body:not(.authed) > *:not(#authGate):not(script):not(style){display:none!important;}

  <div class="wrap">
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="hsub1"></p>
    <p class="sub" style="font-size:.88rem;" data-i18n="hsub2"></p>
    <span class="ver" data-i18n="hbadge"></span>
  </div>
</header>

<div class="toolbar no-print">
  <div class="wrap">
    <button class="btn primary" id="addEntryBtnTop" data-i18n="btnAddEntry"></button>
    <button class="btn gold" id="exportBtn" data-i18n="btnExport"></button>
    <button class="btn" id="importLabelBtn" data-i18n="btnImport"></button>
    <input type="file" id="importInput" accept="application/json">
    <button class="btn" id="printBtn" data-i18n="btnPrint"></button>

<div class="wrap">

  <section class="block">
    <div class="instructions">
      <strong data-i18n="instrLabel"></strong> <span data-i18n="instrBody"></span>
    </div>

    <table class="overview" id="overviewTable"></table>

    <details class="ref">
      <summary data-i18n="refSummary"></summary>

  </section>

  <section class="block">

      <div class="field-grid">

        <div><label class="field-label" data-i18n="gCoLbl"></label><input type="text" id="gCoAuthors"></div>

            <option value="researchArticle" data-i18n="optResearchArticle"></option>
            <option value="academicArticle" data-i18n="optAcademicArticle"></option>

        <div><label class="field-label" data-i18n="gPeriodLbl"></label><input type="text" id="gPeriod"></div>

  <section class="block">

      </div>

  <section class="block">

  </div><!-- /aiSections -->

      </div>
      <p class="hint" style="margin-top:10px;" data-i18n="sigNote"></p>
    </div>
  </section>

  <footer data-i18n="footerText"></footer>

</div>

  function pick(pair){ return pair ? (pair[state.lang] || pair.th || "") : ""; }
  function escapeHTML(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function escapeAttr(s){ return escapeHTML(s).replace(/"/g,"&quot;"); }

  function newEntry(){
    state.counter++;
    return {
      id: "e"+state.counter, tool:"", version:"", date:"", part:"",
      categories:[], extent:null, extentScore:0,
      inputs:[], prompt:"", verifications:[],
      confidence:null, accountable:null, accountableReason:""
    };
  }

  function entryHTML(e, idx){
    var id = e.id;
    function chk(arr, val){ return arr.indexOf(val)>-1 ? "checked" : ""; }

    var catOpts = CATS.map(function(c){
      return '<label class="opt"><input type="checkbox" data-entry-id="'+id+'" data-field="categories" data-value="'+c[0]+'" '+chk(e.categories,c[0])+'>' +
             '<span><span class="code">'+c[0]+'</span> '+pick(c[1])+' <span class="note">('+pick(c[2])+')</span></span></label>';
    }).join("");

    var extOpts = EXTENTS.map(function(x){
      var checked = e.extent===x[0] ? "checked" : "";
      return '<label class="opt"><input type="radio" name="extent-'+id+'" data-entry-id="'+id+'" data-field="extent" data-value="'+x[0]+'" data-score="'+x[1]+'" '+checked+'>' +
             '<span><span class="code">'+x[0]+'</span> '+pick(x[2])+' <span class="score-chip">'+x[1]+T("valPts")+'</span> <span class="note">('+pick(x[3])+')</span></span></label>';
    }).join("");

    var inpOpts = INPUTS.map(function(i){
      var noteStr = pick(i[2]);
      return '<label class="opt"><input type="checkbox" data-entry-id="'+id+'" data-field="inputs" data-value="'+i[0]+'" '+chk(e.inputs,i[0])+'>' +
             '<span><span class="code">'+i[0]+'</span> '+pick(i[1])+(noteStr?' <span class="note">('+noteStr+')</span>':'')+'</span></label>';
    }).join("");

    var verOpts = VERIFIES.map(function(v){
      var noteStr = pick(v[2]);
      return '<label class="opt"><input type="checkbox" data-entry-id="'+id+'" data-field="verifications" data-value="'+v[0]+'" '+chk(e.verifications,v[0])+'>' +
             '<span><span class="code">'+v[0]+'</span> '+pick(v[1])+(noteStr?' <span class="note">('+noteStr+')</span>':'')+'</span></label>';
    }).join("");

    var confRow = ["high","mid","low"].map(function(c){
      var labels = {high:T("confHigh"), mid:T("confMid"), low:T("confLow")};
      var checked = e.confidence===c ? "checked" : "";
      return '<label><input type="radio" name="conf-'+id+'" data-entry-id="'+id+'" data-field="confidence" data-value="'+c+'" '+checked+'> '+labels[c]+'</label>';
    }).join("");

    var acctRow = ["yes","no"].map(function(a){
      var labels = {yes:T("acctYes"), no:T("acctNo")};
      var checked = e.accountable===a ? "checked" : "";
      return '<label><input type="radio" name="acct-'+id+'" data-entry-id="'+id+'" data-field="accountable" data-value="'+a+'" '+checked+'> '+labels[a]+'</label>';
    }).join("");

    var titleText = T("entryTitlePrefix")+" "+(idx+1)+(e.tool? " — "+e.tool : "");

    return '' +
    '<div class="card entry-card" data-card-id="'+id+'">' +
      '<div class="entry-head"><span class="title">'+escapeHTML(titleText)+'</span>' +
        '<button class="btn small danger-outline no-print" data-remove="'+id+'">'+T("btnRemove")+'</button></div>' +
      '<div class="field-grid">' +
        '<div><label class="field-label">'+T("fToolLbl")+'</label><input type="text" data-entry-id="'+id+'" data-field="tool" value="'+escapeAttr(e.tool)+'"></div>' +
        '<div><label class="field-label">'+T("fVersionLbl")+'</label><input type="text" data-entry-id="'+id+'" data-field="version" value="'+escapeAttr(e.version)+'"></div>' +
        '<div><label class="field-label">'+T("fDateLbl")+'</label><input type="date" data-entry-id="'+id+'" data-field="date" value="'+escapeAttr(e.date)+'"></div>' +
        '<div><label class="field-label">'+T("fPartLbl")+'</label><input type="text" data-entry-id="'+id+'" data-field="part" placeholder="'+T("fPartPh")+'" value="'+escapeAttr(e.part)+'"></div>' +
      '</div>' +
      '<div class="q-label">'+T("q1")+' <span class="q-hint">('+T("q1hint")+')</span></div>' + catOpts +
      '<div class="q-label">'+T("q2")+' <span class="q-hint">('+T("q2hint")+')</span></div>' + extOpts +
      '<div class="q-label">'+T("q3")+' <span class="q-hint">('+T("q3hint")+')</span></div>' + inpOpts +
      '<div class="q-label">'+T("q4")+'</div>' +
      '<textarea data-entry-id="'+id+'" data-field="prompt">'+escapeHTML(e.prompt)+'</textarea>' +
      '<div class="q-label">'+T("q5")+' <span class="q-hint">('+T("q5hint")+')</span></div>' + verOpts +
      '<div class="q-label">'+T("q6")+'</div>' +
      '<div class="radio-row">'+confRow+'</div>' +
      '<div class="q-label">'+T("q7")+'</div>' +
      '<div class="radio-row">'+acctRow+'</div>' +
      '<input type="text" style="margin-top:8px;" placeholder="'+T("acctReasonPh")+'" data-entry-id="'+id+'" data-field="accountableReason" value="'+escapeAttr(e.accountableReason)+'">' +
    '</div>';
  }

  function renderEntries(){
    var c = document.getElementById("entriesContainer");
    if(state.entries.length===0){
      c.innerHTML = '<div class="empty-state">'+T("emptyState")+'</div>';
      return;
    }
    c.innerHTML = state.entries.map(entryHTML).join("");
  }

  function renderChecklist(containerId, items, prefix){
    var c = document.getElementById(containerId);
    c.innerHTML = items.map(function(t, i){
      return '<label class="cert-item"><input type="checkbox" id="'+prefix+i+'"><span>'+pick(t)+'</span></label>';
    }).join("");
  }

  function renderOverviewTable(){
    var t = document.getElementById("overviewTable");
    var h = T("ovH"), rows = T("ovRows");
    var html = '<tr><th>'+h[0]+'</th><th>'+h[1]+'</th><th>'+h[2]+'</th><th>'+h[3]+'</th></tr>';
    rows.forEach(function(r){
      html += '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';
    });
    t.innerHTML = html;
  }

  function renderMasterTable(){
    var t = document.getElementById("masterTable");
    var h = T("mH");
    var rows = [];
    CATS.forEach(function(c){ rows.push([T("grpCat"), c[0], pick(c[1]), T("valNone"), "tag-none"]); });
    EXTENTS.forEach(function(x){ rows.push([T("grpExt"), x[0], pick(x[2]), x[1]+T("valPts"), "tag-scored"]); });
    INPUTS.forEach(function(i){
      var val = i[3] ? T("valFlag") : T("valZeroSafe");
      rows.push([T("grpInp"), i[0], pick(i[1]), val, i[3] ? "tag-flag" : "tag-none"]);
    });
    VERIFIES.forEach(function(v){
      var val = v[0]==="V4" ? T("valFlagV4") : T("valVerified");
      rows.push([T("grpVer"), v[0], pick(v[1]), val, v[0]==="V4" ? "tag-flag" : "tag-none"]);
    });
    var html = '<tr><th>'+h[0]+'</th><th>'+h[1]+'</th><th>'+h[2]+'</th><th>'+h[3]+'</th></tr>';
    rows.forEach(function(r){
      html += '<tr><td>'+r[0]+'</td><td><strong>'+r[1]+'</strong></td><td>'+r[2]+'</td><td class="'+r[4]+'">'+r[3]+'</td></tr>';
    });
    t.innerHTML = html;

    document.getElementById("masterLegend").innerHTML =
      '<span class="swatch tag-scored">'+T("legendGreen")+'</span>'+T("legendGreenTxt")+
      '<span class="swatch tag-flag">'+T("legendOrange")+'</span>'+T("legendOrangeTxt")+
      '<span class="swatch tag-none">'+T("legendGray")+'</span>'+T("legendGrayTxt");
  }

  function recalc(){
    var entries = state.entries;
    var n = entries.length;
    var sumL = entries.reduce(function(s,e){ return s + (e.extentScore||0); }, 0);
    var percent = n>0 ? (sumL/(5*n))*100 : 0;
    var highRisk = entries.filter(function(e){
      return e.inputs.some(function(v){ return v==="I2"||v==="I3"||v==="I4"; });
    }).length;
    var pendingV4 = entries.filter(function(e){ return e.verifications.indexOf("V4")>-1; }).length;
    var threshold = Number(document.getElementById("thresholdInput").value) || 0;

    document.getElementById("sumEntries").textContent = n;
    document.getElementById("sumL").textContent = sumL;
    document.getElementById("highRiskCount").textContent = highRisk;
    document.getElementById("pendingVerifyCount").textContent = pendingV4;
    document.getElementById("percentDisplay").textContent = percent.toFixed(1)+"%";
    document.getElementById("formulaText").textContent = T("formulaText");
    document.getElementById("formulaLine").textContent =
      (state.lang==="th"?"แทนค่า: ":"Substituting: ")+"["+sumL+" ÷ (5 × "+n+")] × 100 = "+percent.toFixed(1)+"%";
    document.getElementById("ivNote").textContent = T("ivNote");

    var fill = document.getElementById("gaugeFill");
    fill.style.width = Math.min(percent,100)+"%";
    var markEl = document.getElementById("gaugeThresholdMark");
    markEl.style.left = Math.min(threshold,100)+"%";
    markEl.setAttribute("data-label", T("thresholdGaugeLabel"));

    var badge = document.getElementById("percentResult");
    if(n===0){
      badge.textContent = T("resultNeutral");
      badge.className = "result-badge neutral";
      fill.style.background = "var(--text-soft)";
    } else if(percent<=threshold && highRisk===0 && pendingV4===0){
      badge.textContent = T("resultOk");
      badge.className = "result-badge ok";
      fill.style.background = "var(--green)";
    } else if(percent<=threshold){
      badge.textContent = T("resultWarn");
      badge.className = "result-badge warn";
      fill.style.background = "var(--amber)";
    } else {
      badge.textContent = T("resultDanger");
      badge.className = "result-badge danger";
      fill.style.background = "var(--red)";
    }
  }

  function addEntry(){
    state.entries.push(newEntry());
    renderEntries();
    recalc();
  }
  function removeEntry(id){
    state.entries = state.entries.filter(function(e){ return e.id!==id; });
    renderEntries();
    recalc();
  }

  document.getElementById("entriesContainer").addEventListener("input", handleEntryChange);
  document.getElementById("entriesContainer").addEventListener("change", handleEntryChange);
  document.getElementById("entriesContainer").addEventListener("click", function(ev){
    var node = ev.target;
    var root = this;
    while(node && node !== root){
      if(node.getAttribute && node.getAttribute("data-remove")){
        removeEntry(node.getAttribute("data-remove"));
        return;
      }
      node = node.parentNode;
    }
  });

  function findEntry(id){
    for(var i=0;i<state.entries.length;i++){
      if(state.entries[i].id===id) return state.entries[i];
    }
    return null;
  }

  function handleEntryChange(ev){
    var t = ev.target;
    var id = t.getAttribute("data-entry-id");
    if(!id) return;
    var entry = findEntry(id);
    if(!entry) return;
    var field = t.getAttribute("data-field");
    if(!field) return;

    if(t.type==="checkbox"){
      var val = t.getAttribute("data-value");
      if(t.checked){ if(entry[field].indexOf(val)===-1) entry[field].push(val); }
      else { entry[field] = entry[field].filter(function(v){ return v!==val; }); }
    } else if(t.type==="radio"){
      entry[field] = t.getAttribute("data-value");
      if(field==="extent"){ entry.extentScore = Number(t.getAttribute("data-score")); }
    } else {
      entry[field] = t.value;
      if(field==="tool"){
        var head = document.querySelector('[data-card-id="'+id+'"] .entry-head .title');
        if(head){
          var idx = state.entries.indexOf(entry);
          head.textContent = T("entryTitlePrefix")+" "+(idx+1)+(entry.tool? " — "+entry.tool : "");
        }
      }
    }
    recalc();
  }

  document.getElementById("thresholdInput").addEventListener("input", recalc);
  document.getElementById("addEntryBtn").addEventListener("click", addEntry);
  document.getElementById("addEntryBtnTop").addEventListener("click", addEntry);

  function updateDeclVisibility(){
    var isNo = document.getElementById("declNo").checked;
    document.getElementById("aiSections").style.display = isNo ? "none" : "block";
  }
  document.getElementById("declNo").addEventListener("change", updateDeclVisibility);
  document.getElementById("declYes").addEventListener("change", updateDeclVisibility);

  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });

  // ============== Export / Import ==============
  function collectAll(){
    function v(id){ var e=document.getElementById(id); return e? e.value : ""; }
    function c(id){ var e=document.getElementById(id); return e? e.checked : false; }
    function radioVal(name){
      var checked = document.querySelector('input[name="'+name+'"]:checked');
      return checked ? checked.value : null;
    }
    var certChecked = CERTS.map(function(_,i){ return c("cert"+i); });
    var advChecked = ADVISOR_ITEMS.map(function(_,i){ return c("adv"+i); });
    return {
      lang: state.lang,
      general:{ name:v("gName"), coAuthors:v("gCoAuthors"), institution:v("gInstitution"),
                workType:v("gWorkType"), title:v("gTitle"), advisor:v("gAdvisor"), period:v("gPeriod") },
      declaration: radioVal("decl"),
      entries: state.entries,
      counter: state.counter,
      threshold: Number(v("thresholdInput"))||40,
      overallRisk: radioVal("overallRisk"),
      certChecked: certChecked,
      advChecked: advChecked,
      signatures:{ researcher:v("sigResearcher"), researcherDate:v("sigResearcherDate"),
                   coAuthor:v("sigCoAuthor"), coAuthorDate:v("sigCoAuthorDate"),
                   advisor:v("sigAdvisor"), advisorDate:v("sigAdvisorDate") }
    };
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    var data = collectAll();
    var blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = "ai-ethics-tool-"+stamp+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importLabelBtn").addEventListener("click", function(){
    document.getElementById("importInput").click();
  });
  document.getElementById("importInput").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        applyData(data);
      }catch(err){
        alert(state.lang==="th" ? "ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบว่าเป็นไฟล์ JSON ที่ดาวน์โหลดจากเครื่องมือนี้"
                                 : "Could not read this file. Please check it is a JSON file downloaded from this instrument.");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  function applyData(data){
    function setV(id,val){ var e=document.getElementById(id); if(e && val!==undefined) e.value = val; }
    function setC(id,val){ var e=document.getElementById(id); if(e) e.checked = !!val; }
    if(data.lang==="th" || data.lang==="en"){ setLanguage(data.lang); }
    if(data.general){
      setV("gName", data.general.name); setV("gCoAuthors", data.general.coAuthors);
      setV("gInstitution", data.general.institution); setV("gWorkType", data.general.workType);
      setV("gTitle", data.general.title); setV("gAdvisor", data.general.advisor); setV("gPeriod", data.general.period);
    }
    if(data.declaration==="no"){ document.getElementById("declNo").checked = true; }
    else { document.getElementById("declYes").checked = true; }
    updateDeclVisibility();

    state.entries = Array.isArray(data.entries) ? data.entries : [];
    state.counter = data.counter || state.entries.length;
    renderEntries();

    setV("thresholdInput", data.threshold || 40);
    if(data.overallRisk){
      var r = document.querySelector('input[name="overallRisk"][value="'+data.overallRisk+'"]');
      if(r) r.checked = true;
    }
    if(Array.isArray(data.certChecked)){
      data.certChecked.forEach(function(v,i){ setC("cert"+i, v); });
    }
    if(Array.isArray(data.advChecked)){
      data.advChecked.forEach(function(v,i){ setC("adv"+i, v); });
    }
    if(data.signatures){
      setV("sigResearcher", data.signatures.researcher); setV("sigResearcherDate", data.signatures.researcherDate);
      setV("sigCoAuthor", data.signatures.coAuthor); setV("sigCoAuthorDate", data.signatures.coAuthorDate);
      setV("sigAdvisor", data.signatures.advisor); setV("sigAdvisorDate", data.signatures.advisorDate);
    }
    recalc();
  }

  // ============== Language switching ==============
  function applyStaticI18n(){
    var nodes = document.querySelectorAll("[data-i18n]");
    for(var ni=0; ni<nodes.length; ni++){
      var node = nodes[ni];
      var key = node.getAttribute("data-i18n");
      var val = T(key);
      if(val!==undefined) node.textContent = val;
    }
    document.documentElement.lang = state.lang;
    document.getElementById("pageTitleTag").textContent = T("h1");
    document.getElementById("langTh").className = state.lang==="th" ? "active" : "";
    document.getElementById("langEn").className = state.lang==="en" ? "active" : "";
  }

  function setLanguage(lang){
    state.lang = lang;
    applyStaticI18n();
    renderOverviewTable();
    renderMasterTable();
    renderEntries();
    renderChecklist("certList", CERTS, "cert");
    renderChecklist("advisorList", ADVISOR_ITEMS, "adv");
    recalc();
  }
  document.getElementById("langTh").addEventListener("click", function(){ setLanguage("th"); });
  document.getElementById("langEn").addEventListener("click", function(){ setLanguage("en"); });

  // รับคำสั่งเปลี่ยนภาษาจากแอพหลัก (เมื่อฝังใน iframe)
  window.addEventListener("message", function(ev){ var d=ev.data; if(d && d.type==="mcu-set-lang" && (d.lang==="th"||d.lang==="en")) setLanguage(d.lang); });

  // init
  setLanguage("th");
})();
</script>
</body>
</html>
